name: NeuroX checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-security.txt
      - run: python -m pytest -q
      - run: ruff check app --select F
      - run: bandit -r app
      - run: pip-audit

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neurox
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: neurox_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurox -d neurox_migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/verify_postgres.py
        env:
          POSTGRES_URL: postgresql+psycopg://neurox:ci-only-password@localhost:5432/neurox_migration_test

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/caregiver-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/caregiver-dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm audit --audit-level=critical

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/NeuroX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's legacy default includes the removed SDK package
          # named `tools`. Keep the CI SDK explicit and aligned with
          # app/build.gradle.kts instead.
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest assembleRelease
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: ./gradlew --no-daemon exportReleaseDependencies
      - run: python ../../scripts/check_android_dependencies.py app/build/reports/release-dependencies.json
      - run: python ../../scripts/check_release_apk.py app/build/outputs/apk/release/app-release-unsigned.apk app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: neurox-debug-apk
          path: android/NeuroX/app/build/outputs/apk/debug/*.apk
