name: NeuroX checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new version tag to build (for example v1.0.0)
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-security.txt
      - run: python -m pytest -q
      - run: ruff check app --select F
      - run: bandit -r app
      - run: pip-audit

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neurox
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: neurox_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurox -d neurox_migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/verify_postgres.py
        env:
          POSTGRES_URL: postgresql+psycopg://neurox:ci-only-password@localhost:5432/neurox_migration_test

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/caregiver-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/caregiver-dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm audit --audit-level=critical

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/NeuroX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's legacy default includes the removed SDK package
          # named `tools`. Keep the CI SDK explicit and aligned with
          # app/build.gradle.kts instead.
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest assembleRelease
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: ./gradlew --no-daemon exportReleaseDependencies
      - run: python ../../scripts/check_android_dependencies.py app/build/reports/release-dependencies.json
      - run: python ../../scripts/check_release_apk.py app/build/outputs/apk/release/app-release-unsigned.apk app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: neurox-debug-apk
          path: android/NeuroX/app/build/outputs/apk/debug/*.apk

  android-release:
    name: Publish Android release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android/NeuroX
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "ANDROID_KEYSTORE_BASE64 is required"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is required"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is required"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is required"; exit 1; }
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neurox-release.jks"
      - name: Build signed APK and Play Store bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/neurox-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean assembleRelease bundleRelease
      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          apk="NeuroX-${RELEASE_TAG}.apk"
          bundle="NeuroX-${RELEASE_TAG}.aab"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cp app/build/outputs/bundle/release/app-release.aab "$bundle"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk" "$bundle" --clobber
          else
            gh release create "$RELEASE_TAG" "$apk" "$bundle" \
              --title "NeuroX ${RELEASE_TAG}" \
              --generate-notes
          fi
